<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonExA</title>
    <meta name="theme-color" content="#03173d" />
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="Resources/MonexaIconTransparentWhite.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="Resources/MonexaIconTransparentWhite.png" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />

</head>

<body>
    <div id="app">
        <!-- Startbildschirm, solange Blazor lädt. Gleiches Markup wie Shared/LoadingScreen.razor. -->
        <div class="monexa-splash" role="status" aria-live="polite">
            <div class="monexa-splash__content">
                <div class="monexa-splash__logo-wrap">
                    <div class="monexa-splash__glow"></div>
                    <div class="monexa-splash__logo-backing"></div>
                    <img class="monexa-splash__logo" src="Resources/MonexaIconTransparent.png" alt="MonExA" width="104" height="104" />
                </div>
                <h1 class="monexa-splash__title">Mon<span>Ex</span>A</h1>
                <p class="monexa-splash__tagline">Money · Expenses · Analysis</p>
                <div class="monexa-splash__progress"><div class="monexa-splash__bar"></div></div>
                <p class="monexa-splash__status monexa-splash__status--percent"></p>
            </div>
            <p class="monexa-splash__credit">by <strong>Lucas Nagelsmann</strong></p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
    <script src="js/monexa.js"></script>

</body>

</html>
